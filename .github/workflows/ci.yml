name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail instead of skipping D-Bus tests if dbus-daemon is missing.
  HELIX_REQUIRE_DBUS: "1"

jobs:
  check:
    runs-on: ubuntu-24.04
    # A hung test fails the run instead of holding it for hours (a full run takes about 8 minutes).
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-desktop

      # Contract tests read the living spec from a sibling checkout.
      - uses: actions/checkout@v4
        with:
          repository: helixdesktop/spec
          path: spec

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libwayland-dev libxkbcommon-dev \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang \
            dbus gsettings-desktop-schemas gettext

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helix-desktop

      # po/POTFILES and the template must match the sources, and every
      # translation must compile (msgfmt --check) and keep the placeholders
      # and date fields of the original messages (TRANSLATING.md).
      - name: Check translations
        working-directory: helix-desktop
        run: |
          tools/i18n/update-pot.sh --check
          python3 tools/i18n/check-po.py

      - name: Clippy
        working-directory: helix-desktop
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Test
        working-directory: helix-desktop
        env:
          HELIX_SPEC_DIR: ${{ github.workspace }}/spec
        run: cargo test --workspace --locked

  # The X11 tests under a real Xwayland, with either X11 window manager:
  # Smithay's (the default) and Helix's own (HELIX_XWM=helix, #191).
  x11:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        xwm: [smithay, helix]
    steps:
      - uses: actions/checkout@v4
        with:
          path: helix-desktop

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libglib2.0-dev libwayland-dev libxkbcommon-dev \
            libseat-dev libinput-dev libudev-dev libgbm-dev libdrm-dev libegl-dev \
            libpipewire-0.3-dev libspa-0.2-dev clang \
            dbus gsettings-desktop-schemas xwayland

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: helix-desktop

      - name: X11 tests
        working-directory: helix-desktop
        env:
          HELIX_XWM: ${{ matrix.xwm }}
        run: >
          cargo test -p helix-comp --locked --no-fail-fast
          --test move_unmaximize --test x11_alpha --test x11_blocking --test x11_clipboard
          --test x11_configure --test x11_dnd --test x11_ewmh --test x11_focus --test x11_map
          --test x11_props --test x11_selection --test x11_shell
          --test x11_stacking --test x11_windows
